<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verity 3D</title>
  <style>
    :root {
      --bg-1: #0f172a;
      --bg-2: #111827;
      --panel: rgba(17, 24, 39, 0.9);
      --panel-2: rgba(30, 41, 59, 0.95);
      --primary: #6366f1;
      --secondary: #ec4899;
      --accent: #8b5cf6;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --good: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --border: rgba(148, 163, 184, 0.25);
      --shadow: rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
      color: var(--text);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: stretch;
      min-height: 100vh;
      padding: 18px;
    }

    .app {
      width: 100%;
      max-width: 1200px;
      min-height: 92vh;
      display: flex;
      flex-direction: column;
      border-radius: 22px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid var(--border);
      box-shadow: 0 18px 38px var(--shadow);
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 22px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-icon {
      font-size: 2rem;
      filter: drop-shadow(0 3px 8px rgba(0,0,0,0.18));
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(1.4rem, 2vw, 2.3rem);
      line-height: 1.1;
    }

    .brand small {
      display: block;
      opacity: 0.85;
      font-size: 0.77rem;
    }

    .status-pill {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.22);
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      white-space: nowrap;
    }

    .content {
      display: grid;
      grid-template-columns: 1.8fr 1fr;
      gap: 18px;
      flex: 1;
      padding: 18px;
      min-height: 0;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 18px var(--shadow);
    }

    .chat-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .messages {
      flex: 1;
      min-height: 340px;
      max-height: 62vh;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: rgba(15, 23, 42, 0.5);
    }

    .message {
      max-width: 82%;
      padding: 14px 16px;
      border-radius: 16px;
      line-height: 1.5;
      word-break: break-word;
      white-space: pre-line;
    }

    .message.bot {
      align-self: flex-start;
      background: linear-gradient(135deg, var(--primary), #4f46e5);
      border-left: 4px solid var(--secondary);
    }

    .message.user {
      align-self: flex-end;
      background: #334155;
      border-right: 4px solid var(--secondary);
    }

    .message strong {
      display: block;
      margin-bottom: 6px;
      font-size: 0.8rem;
      opacity: 0.9;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      border-top: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.45);
    }

    .toolbar label {
      font-weight: bold;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .toolbar select {
      flex: 1;
      background: var(--bg-1);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.95rem;
    }

    .input-row {
      display: flex;
      gap: 10px;
      padding: 12px 18px 18px;
      border-top: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.45);
    }

    .input-row input {
      flex: 1;
      background: var(--bg-1);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 1rem;
    }

    .input-row input::placeholder {
      color: rgba(226, 232, 240, 0.5);
    }

    .input-row button {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: bold;
      color: white;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      cursor: pointer;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .input-row button:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }

    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-height: 0;
    }

    .tools, .summary {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 8px 18px var(--shadow);
    }

    .tools h2, .summary h2 {
      margin: 0 0 14px 0;
      font-size: 1.1rem;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(120px, 1fr));
      gap: 10px;
    }

    .tool-btn {
      border: none;
      border-radius: 12px;
      padding: 14px 10px;
      font-weight: bold;
      color: white;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .tool-btn:hover {
      transform: translateY(-2px);
      opacity: 0.97;
    }

    .summary-box {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      font-size: 0.94rem;
      color: var(--text);
      line-height: 1.5;
    }

    .summary-box strong {
      color: #fff;
    }

    .footer {
      padding: 10px 18px 18px;
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
    }

    @media (max-width: 900px) {
      .content {
        grid-template-columns: 1fr;
      }

      .messages {
        max-height: 48vh;
      }
    }

    @media (max-width: 560px) {
      .topbar {
        padding: 16px;
      }

      .brand h1 {
        font-size: 1.3rem;
      }

      .status-pill {
        display: none;
      }

      .tool-grid {
        grid-template-columns: 1fr;
      }

      .input-row {
        flex-direction: column;
      }

      .input-row button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-icon">🚀</span>
        <div>
          <h1>Verity 3D</h1>
          <small>IA para impressão 3D</small>
        </div>
      </div>
      <div class="status-pill">Web App · Online</div>
    </header>

    <div class="content">
      <section class="panel chat-panel">
        <div id="messages" class="messages"></div>

        <div class="toolbar">
          <label for="modeSelect">Modo:</label>
          <select id="modeSelect">
            <option value="rapido">⚡ Rápido</option>
            <option value="inteligencia">🧠 Inteligência</option>
            <option value="pesquisa">🔍 Pesquisa</option>
          </select>
        </div>

        <div class="input-row">
          <input id="questionInput" type="text" placeholder="Digite sua pergunta..." />
          <button id="sendBtn">Enviar</button>
        </div>
      </section>

      <aside class="side-panel">
        <div class="tools panel">
          <h2>Comandos rápidos</h2>
          <div class="tool-grid">
            <button class="tool-btn" data-cmd="analisar_modelo">📊 Analisar Modelo</button>
            <button class="tool-btn" data-cmd="otimizar_para_impressao">⚙️ Otimizar</button>
            <button class="tool-btn" data-cmd="gerar_suportes">🎯 Suportes</button>
            <button class="tool-btn" data-cmd="estimar_tempo">⏱️ Tempo</button>
          </div>
        </div>

        <div class="summary">
          <h2>Resumo da IA</h2>
          <div class="summary-box">
            <strong>Verity 3D</strong> ajuda com:
            <br>- resolução de problemas de impressão
            <br>- respostas rápidas e inteligentes
            <br>- análise de modelos 3D
            <br>- suporte para PLA, ABS e peças complexas
          </div>
        </div>
      </aside>
    </div>

    <div class="footer">Verity 3D © 2025 · Tudo em uma aba</div>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const questionInput = document.getElementById("questionInput");
    const sendBtn = document.getElementById("sendBtn");
    const modeSelect = document.getElementById("modeSelect");

    const memoryKey = "verity3d_memory";

    // Base de conhecimento sobre impressão 3D
    const knowledgeBase = {
      "warping": {
        keywords: ["warping", "empenamento", "empenar", "enrugado"],
        answer: "Warping é quando as bordas da peça ficam empenadas. Causas:\n- Mesa muito fria\n- Ventilação excessiva (desligar o ventilador na primeira camada)\n- Diferença de temperatura entre base e peça\n- Material não adequado\n\nSoluções:\n- Aqueça a mesa para PLA (50-60°C) e ABS (80-100°C)\n- Desabilite ou reduza ventilação nas primeiras camadas\n- Use uma cama aquecida\n- Tente usar raft ou brim para melhor aderência"
      },
      "aderencia": {
        keywords: ["aderência", "aderencia", "adesão", "não colando", "nao cola", "descolando"],
        answer: "Problema de aderência da primeira camada. Verifique:\n- Nível da mesa (papel deve passar com leve resistência)\n- Limpeza da mesa (remova resíduos com álcool)\n- Temperatura da mesa: PLA 50-60°C, ABS 80-100°C\n- Velocidade (reduzir para 20-25 mm/s na primeira camada)\n- Material do leito (vidro, PEI, cama magnética)\n\nTente:\n- Aumentar temperatura 5°C\n- Descer o bico um pouco mais\n- Limpar a mesa completamente\n- Usar primer ou cola se necessário"
      },
      "suporte": {
        keywords: ["suporte", "suportes", "suporte material", "preciso de suporte", "onde colocar suporte"],
        answer: "Suportes são estruturas para sustentar partes que saem para fora do modelo.\n\nQuando usar:\n- Ângulos maiores que 45°\n- Saliências sem base\n- Detalhes pendentes\n\nDicas:\n- Gerar suporte apenas onde necessário\n- Usar densidade baixa (15-20%) para fácil remoção\n- Orientar modelo para minimizar suportes\n- Deixar pequeno espaço entre suporte e modelo (0.2mm)\n\nFerramentas: Cura, PrusaSlicer, SuperSlicer têm gerador automático"
      },
      "temperatura": {
        keywords: ["temperatura", "quente", "frio", "temperatura bico", "temperatura mesa"],
        answer: "Temperaturas recomendadas por material:\n\nPLA: 200-210°C (bico), 50-60°C (mesa)\nABS: 230-250°C (bico), 80-100°C (mesa)\nPETG: 230-250°C (bico), 70-80°C (mesa)\nTPU: 210-230°C (bico), 20-40°C (mesa)\n\nDicas:\n- Aumentar 5°C se a peça fica quebradiça\n- Reduzir 5°C se derreter ou ficar com fios\n- Testar com torre de temperatura para encontrar o ideal\n- Considerar velocidade (mais rápido = temperatura maior)"
      },
      "tempo": {
        keywords: ["quanto tempo", "tempo de impressão", "quanto demora", "velocidade impressão"],
        answer: "Tempo de impressão depende de:\n- Volume do modelo\n- Altura (Z)\n- Velocidade de impressão\n- Altura de camada\n- Preenchimento (infill)\n\nEstimativas gerais:\n- Peça pequena (miniatura): 30-60 min\n- Peça média: 2-6 horas\n- Peça grande: 8-24+ horas\n\nPara reduzir tempo:\n- Aumentar velocidade de 60 para 80-100 mm/s\n- Aumentar altura de camada (0.3mm ao invés de 0.2mm)\n- Reduzir preenchimento (infill) para 10-15%"
      },
      "camada": {
        keywords: ["camada", "layer height", "altura camada", "grossura camada"],
        answer: "Altura de camada afeta qualidade e tempo:\n\n0.1mm: Máxima qualidade, muito lento\n0.2mm: Padrão, bom equilíbrio qualidade/velocidade (RECOMENDADO)\n0.3mm: Mais rápido, menos detalhes\n0.4mm: Muito rápido, qualidade ruim\n\nDica: Use 0.2mm como padrão. Aumentar para 0.3mm apenas para peças grandes e rápidas.\nNunca ultrapasse 75% da altura do bico (ex: bico 0.4mm = máx 0.3mm de camada)"
      },
      "velocidade": {
        keywords: ["velocidade", "rápido", "lento", "velocidade impressão"],
        answer: "Velocidades recomendadas:\n\nPrimeira camada: 15-25 mm/s (importante para aderência)\nCamadas normais: 50-70 mm/s\nCamadas de contorno: 30-50 mm/s\nPerenchimento: 60-100 mm/s\n\nDicas:\n- Começar com 50 mm/s e ajustar\n- Aumentar 10 mm/s de cada vez\n- Se houver camadas ruins, reduzir velocidade\n- Impressora mais rígida = velocidade maior possível"
      },
      "filamento": {
        keywords: ["filamento", "pla", "abs", "petg", "tpu", "tipo filamento", "qual filamento"],
        answer: "Tipos principais:\n\nPLA: Mais fácil, biodegradável, frágil, ideal para iniciantes\nABS: Forte, flexível, mais difícil (requer mesa aquecida)\nPETG: Balanço entre PLA e ABS, resistente\nTPU: Flexível, macio, bom para peças que precisam dobrar\n\nDicas:\n- PLA é melhor para começar\n- ABS precisa de ventilação controlada\n- Secar filamento antes de usar\n- Guardar em saco com dessecante"
      },
      "qualidade": {
        keywords: ["qualidade", "ruim", "feio", "não fica bom", "impression ruim"],
        answer: "Checklist de qualidade:\n\n✓ Primeira camada bem aderida\n✓ Sem fios entre camadas\n✓ Sem buraco ou falhas\n✓ Superfície lisa\n✓ Camadas uniformes\n\nProblemas comuns:\n- Fios: ajustar retração ou temperatura\n- Furos: aumentar infill ou velocidade\n- Superfície áspera: aumentar temperatura ou reduzir velocidade\n- Delaminação: primeiro aumento temperatura, depois velocidade\n\nTente: calibrar extrusora, nivelar mesa e testar temperaturas"
      },
      "calibracao": {
        keywords: ["calibração", "calibracao", "calibrar", "ajuste"],
        answer: "Calibrações importantes:\n\n1. Nível da mesa: papel entre bico e mesa com leve resistência\n2. Fluxo de material (E-steps): imprimir cubo 20x20x20mm e medir\n3. Altura Z: primeira camada deve ser plana e colante\n4. Temperatura: torre de testes\n5. Retração: teste de espaguete\n\nDica: Fazer calibração regularmente, especialmente depois de limpeza"
      }
    };

    function loadMemory() {
      const raw = localStorage.getItem(memoryKey);
      if (!raw) {
        return [];
      }
      try {
        return JSON.parse(raw);
      } catch {
        return [];
      }
    }

    function saveMemory(data) {
      localStorage.setItem(memoryKey, JSON.stringify(data));
    }

    function addMessage(text, sender = "bot") {
      const div = document.createElement("div");
      div.className = `message ${sender}`;
      div.innerHTML = `<strong>${sender === "bot" ? "Verity 3D:" : "Você:"}</strong><p>${text}</p>`;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // Busca na base de conhecimento
    function searchKnowledge(question) {
      const cleanQuestion = question.toLowerCase();
      
      for (const [topic, data] of Object.entries(knowledgeBase)) {
        for (const keyword of data.keywords) {
          if (cleanQuestion.includes(keyword)) {
            return data.answer;
          }
        }
      }
      
      return null;
    }

    function answerInteligencia(question) {
      const knowledgeAnswer = searchKnowledge(question);
      
      if (knowledgeAnswer) {
        return `Modo Inteligência: análise detalhada.\n\nPergunta: ${question}\n\n${knowledgeAnswer}`;
      }
      
      return `Modo Inteligência: análise detalhada.\n\nPergunta: ${question}\n\nResposta:\nSua pergunta é sobre impressão 3D. Recomendo:\n- Verificar a temperatura do bico e da mesa\n- Nivelar a mesa corretamente\n- Usar a velocidade adequada (50-70 mm/s)\n- Verificar o nível de aderência da primeira camada\n\nSe o problema persistir, tente reduzir a velocidade e aumentar a temperatura em 5°C.`;
    }

    function answerRapido(question) {
      const knowledgeAnswer = searchKnowledge(question);
      
      if (knowledgeAnswer) {
        return `Modo Rápido: resposta direta.\n\n${knowledgeAnswer}`;
      }
      
      return `Modo Rápido: resposta direta.\n\nAjuste: temperatura, mesa, velocidade e aderência da primeira camada. Se persistir, reduza velocidade.`;
    }

    function answerPesquisa(question) {
      const knowledgeAnswer = searchKnowledge(question);
      
      if (knowledgeAnswer) {
        return `Modo Pesquisa: revisão de conhecimento.\n\nPergunta: ${question}\n\n${knowledgeAnswer}`;
      }
      
      return `Modo Pesquisa: revisão de conhecimento.\n\nSua pergunta parece ser sobre impressão 3D. Tópicos relacionados:\n- PLA vs ABS vs PETG\n- Calibração de impressora\n- Resolução de problemas\n- Slicing e configurações\n\nQual aspecto específico deseja aprofundar?`;
    }

    function getBotResponse(question, mode) {
      const lowercase = (mode || "rapido").toLowerCase();

      if (lowercase === "inteligencia") return answerInteligencia(question);
      if (lowercase === "pesquisa") return answerPesquisa(question);

      return answerRapido(question);
    }

    function saveToMemory(question, answer, mode) {
      const memory = loadMemory();
      memory.push({ question, answer, mode, time: new Date().toISOString() });
      if (memory.length > 25) {
        memory.splice(0, memory.length - 25);
      }
      saveMemory(memory);
    }

    function runCommand(command) {
      const base = {
        analisar_modelo: {
          status: "analisado",
          warnings: [
            "Verificar espessura da parede",
            "Checar saliências",
            "Validar base e aderência"
          ],
          suggestion: "Ajuste a orientação antes da impressão"
        },
        otimizar_para_impressao: {
          status: "otimizado",
          material: "PLA",
          recommendations: [
            "Ajustar temperatura da extrusora para 200-210°C",
            "Usar camada 0.2 mm",
            "Reduzir velocidade da primeira camada para 25 mm/s"
          ]
        },
        gerar_suportes: {
          status: "suportes gerados",
          density: 0.8,
          note: "Verifique se os suportes são removíveis sem danificar a peça"
        },
        estimar_tempo: {
          status: "tempo estimado",
          hours: 4.2,
          minutes: 252,
          confidence: "média"
        }
      };

      if (!base[command]) {
        return "Comando não reconhecido.";
      }

      return JSON.stringify(base[command], null, 2);
    }

    function sendQuestion() {
      const question = questionInput.value.trim();
      if (!question) return;

      addMessage(question, "user");
      questionInput.value = "";

      const mode = modeSelect.value || "rapido";
      const answer = getBotResponse(question, mode);

      addMessage(answer, "bot");
      saveToMemory(question, answer, mode);
    }

    sendBtn.addEventListener("click", sendQuestion);

    questionInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        sendQuestion();
      }
    });

    document.querySelectorAll(".tool-btn").forEach(button => {
      button.addEventListener("click", () => {
        const cmd = button.dataset.cmd;
        const result = runCommand(cmd);
        addMessage(result, "bot");
        saveToMemory(`Comando: ${cmd}`, result, "automacao");
      });
    });

    function startWelcome() {
      const welcome = "Olá! 👋 Sou a Verity 3D.\n\nPosso ajudar com:\n- Problemas de impressão (warping, aderência, qualidade)\n- Recomendações de temperatura e velocidade\n- Dúvidas sobre materiais (PLA, ABS, PETG)\n- Calibração e ajustes\n- Análise de modelos 3D\n\nUse o modo de sua preferência:\n⚡ Rápido - respostas diretas\n🧠 Inteligência - análise detalhada\n🔍 Pesquisa - informações e dados\n\nFaça sua pergunta!";

      addMessage(welcome, "bot");
    }

    startWelcome();
  </script>
</body>
</html>
