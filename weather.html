<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Dashboard - Previsão do Tempo</title>
  <style>
    :root {
      --bg: #0b1020;
      --bg-2: #111827;
      --sidebar: #101a2d;
      --panel: rgba(17, 24, 39, 0.95);
      --panel-2: rgba(30, 41, 59, 0.95);
      --primary: #6366f1;
      --secondary: #ec4899;
      --accent: #8b5cf6;
      --text: #e5eefb;
      --muted: #93a4c1;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --border: rgba(148, 163, 184, 0.18);
      --shadow: rgba(0, 0, 0, 0.35);
      --input: #121d33;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, var(--bg), var(--bg-2));
      color: var(--text);
    }

    body {
      min-height: 100vh;
      padding: 14px;
    }

    .app {
      width: 100%;
      max-width: 1400px;
      height: calc(100vh - 28px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 280px 1fr;
      background: rgba(10, 18, 33, 0.9);
      border: 1px solid var(--border);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 26px 55px var(--shadow);
    }

    .sidebar {
      background: linear-gradient(180deg, var(--sidebar), #16233c);
      border-right: 1px solid var(--border);
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 10px 18px;
      border-bottom: 1px solid var(--border);
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 1.5rem;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      box-shadow: 0 8px 12px rgba(99, 102, 241, 0.35);
    }

    .brand h1 {
      margin: 0;
      font-size: 1.25rem;
    }

    .brand small {
      display: block;
      color: var(--muted);
      font-size: 0.72rem;
    }

    .search-box {
      display: flex;
      gap: 8px;
    }

    .search-box input {
      flex: 1;
      padding: 10px 12px;
      background: var(--input);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
    }

    .search-box button {
      padding: 10px 12px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }

    .favorites {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .favorites-title {
      font-weight: 700;
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 4px;
    }

    .favorite-btn {
      padding: 10px 12px;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.35);
      color: var(--text);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
      font-weight: 600;
    }

    .favorite-btn:hover {
      background: rgba(99, 102, 241, 0.2);
    }

    .favorite-btn .remove {
      float: right;
      cursor: pointer;
    }

    .main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: rgba(11, 17, 31, 0.82);
      overflow: auto;
    }

    .content {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .current-weather {
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
      box-shadow: 0 8px 18px var(--shadow);
    }

    .weather-main {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .location-info {
      font-size: 1.1rem;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .temp-display {
      font-size: 4rem;
      font-weight: 700;
      line-height: 1;
      margin: 10px 0;
    }

    .weather-desc {
      font-size: 1.2rem;
      color: var(--text);
      text-transform: capitalize;
      margin-bottom: 8px;
    }

    .weather-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    .weather-details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .detail-item {
      background: rgba(99, 102, 241, 0.08);
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: 12px;
      padding: 14px;
    }

    .detail-label {
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 6px;
    }

    .detail-value {
      font-size: 1.4rem;
      font-weight: 700;
    }

    .hourly-forecast {
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 18px var(--shadow);
    }

    .hourly-forecast h3 {
      margin-top: 0;
      margin-bottom: 16px;
    }

    .hourly-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 10px;
    }

    .hourly-item {
      background: rgba(99, 102, 241, 0.08);
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      min-width: 100px;
      flex-shrink: 0;
    }

    .hour-time {
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 8px;
    }

    .hour-icon {
      font-size: 1.8rem;
      margin: 8px 0;
    }

    .hour-temp {
      font-weight: 700;
      font-size: 1.1rem;
    }

    .daily-forecast {
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 8px 18px var(--shadow);
    }

    .daily-forecast h3 {
      margin-top: 0;
      margin-bottom: 16px;
    }

    .daily-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }

    .daily-item {
      background: rgba(99, 102, 241, 0.08);
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }

    .day-name {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .day-icon {
      font-size: 2rem;
      margin: 8px 0;
    }

    .day-temp {
      font-size: 0.95rem;
      margin-bottom: 6px;
    }

    .day-high {
      font-weight: 700;
      color: #fff;
    }

    .day-low {
      color: var(--muted);
    }

    .day-weather {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 6px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--muted);
    }

    .error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    @media (max-width: 980px) {
      .app {
        grid-template-columns: 1fr;
        height: auto;
      }

      .sidebar {
        border-right: none;
        border-bottom: 1px solid var(--border);
      }

      .current-weather {
        grid-template-columns: 1fr;
      }

      .daily-grid {
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      }
    }

    @media (max-width: 560px) {
      body { padding: 8px; }
      .current-weather { padding: 16px; }
      .temp-display { font-size: 3rem; }
      .weather-details { grid-template-columns: 1fr; }
      .daily-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">🌤️</div>
        <div>
          <h1>Weather</h1>
          <small>Dashboard</small>
        </div>
      </div>

      <div class="search-box">
        <input id="cityInput" type="text" placeholder="Buscar cidade..." />
        <button id="searchBtn">🔍</button>
      </div>

      <div class="favorites">
        <div class="favorites-title">⭐ Favoritos</div>
        <div id="favoritesList"></div>
      </div>

      <button id="geoBtn" style="margin-top: auto; padding: 10px 12px; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: 600;">📍 Usar Localização</button>
    </aside>

    <main class="main">
      <div class="content">
        <div id="errorContainer"></div>
        <div id="weatherContainer"></div>
        <div id="loadingContainer" class="loading">Carregando dados...</div>
      </div>
    </main>
  </div>

  <script>
    const API_KEY = "demo"; // API pública, não requer chave
    const STORAGE_KEY = "weather_favorites";
    const BASE_URL = "https://api.open-meteo.com/v1/forecast";
    const GEO_URL = "https://geocoding-api.open-meteo.com/v1/search";

    let favorites = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    let currentWeather = null;

    class WeatherDashboard {
      constructor() {
        this.initEventListeners();
        this.loadFavorites();
        this.searchByCity("São Paulo");
      }

      initEventListeners() {
        document.getElementById("searchBtn").addEventListener("click", () => this.handleSearch());
        document.getElementById("cityInput").addEventListener("keypress", (e) => {
          if (e.key === "Enter") this.handleSearch();
        });
        document.getElementById("geoBtn").addEventListener("click", () => this.useGeolocation());
      }

      handleSearch() {
        const city = document.getElementById("cityInput").value.trim();
        if (city) {
          this.searchByCity(city);
          document.getElementById("cityInput").value = "";
        }
      }

      async searchByCity(city) {
        try {
          this.showLoading();
          const response = await fetch(`${GEO_URL}?name=${encodeURIComponent(city)}&count=1&language=pt&format=json`);
          const data = await response.json();

          if (data.results && data.results.length > 0) {
            const location = data.results[0];
            this.fetchWeather(location.latitude, location.longitude, `${location.name}, ${location.country}`);
          } else {
            this.showError("Cidade não encontrada");
          }
        } catch (error) {
          this.showError("Erro ao buscar cidade");
        }
      }

      async fetchWeather(lat, lon, name) {
        try {
          this.showLoading();
          const response = await fetch(
            `${BASE_URL}?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m,apparent_temperature,pressure_msl&hourly=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code,precipitation_sum&timezone=auto&language=pt`
          );
          const data = await response.json();
          
          currentWeather = { name, lat, lon, data };
          this.renderWeather();
        } catch (error) {
          this.showError("Erro ao buscar dados meteorológicos");
        }
      }

      useGeolocation() {
        if (navigator.geolocation) {
          this.showLoading();
          navigator.geolocation.getCurrentPosition(
            (position) => {
              const { latitude, longitude } = position.coords;
              this.fetchWeatherByCoords(latitude, longitude);
            },
            () => this.showError("Não foi possível obter sua localização")
          );
        } else {
          this.showError("Geolocalização não suportada");
        }
      }

      async fetchWeatherByCoords(lat, lon) {
        try {
          this.showLoading();
          const geoResponse = await fetch(`${GEO_URL}?latitude=${lat}&longitude=${lon}&count=1&format=json`);
          const geoData = await geoResponse.json();
          
          const name = geoData.results?.[0]?.name || "Sua Localização";
          const weatherResponse = await fetch(
            `${BASE_URL}?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m,apparent_temperature,pressure_msl&hourly=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code,precipitation_sum&timezone=auto&language=pt`
          );
          const weatherData = await weatherResponse.json();
          
          currentWeather = { name, lat, lon, data: weatherData };
          this.renderWeather();
        } catch (error) {
          this.showError("Erro ao buscar dados da localização");
        }
      }

      getWeatherIcon(code) {
        const iconMap = {
          0: "☀️",   // Céu limpo
          1: "🌤️",   // Principalmente céu limpo
          2: "⛅",   // Parcialmente nublado
          3: "☁️",   // Nublado
          45: "🌫️",  // Névoa
          48: "🌫️",  // Névoa de deposição
          51: "🌦️",  // Chuva leve
          53: "🌧️",  // Chuva moderada
          55: "⛈️",  // Chuva forte
          61: "🌧️",  // Chuva leve
          63: "🌧️",  // Chuva moderada
          65: "⛈️",  // Chuva forte
          71: "❄️",  // Neve leve
          73: "❄️",  // Neve moderada
          75: "❄️",  // Neve forte
          80: "🌦️",  // Chuva leve
          81: "🌧️",  // Chuva moderada
          82: "⛈️",  // Chuva forte
          95: "⛈️",  // Tempestade
          96: "⛈️",  // Tempestade com granizo
          99: "⛈️"   // Tempestade forte
        };
        return iconMap[code] || "🌡️";
      }

      getWeatherDescription(code) {
        const descMap = {
          0: "Céu limpo",
          1: "Principalmente céu limpo",
          2: "Parcialmente nublado",
          3: "Nublado",
          45: "Névoa",
          48: "Névoa de deposição",
          51: "Chuva leve",
          53: "Chuva moderada",
          55: "Chuva forte",
          61: "Chuva leve",
          63: "Chuva moderada",
          65: "Chuva forte",
          71: "Neve leve",
          73: "Neve moderada",
          75: "Neve forte",
          80: "Chuva leve",
          81: "Chuva moderada",
          82: "Chuva forte",
          95: "Tempestade",
          96: "Tempestade com granizo",
          99: "Tempestade forte"
        };
        return descMap[code] || "Desconhecido";
      }

      renderWeather() {
        if (!currentWeather) return;

        const { name, data } = currentWeather;
        const current = data.current;
        const hourly = data.hourly;
        const daily = data.daily;

        const temp = Math.round(current.temperature_2m);
        const feelsLike = Math.round(current.apparent_temperature);
        const humidity = current.relative_humidity_2m;
        const windSpeed = current.wind_speed_10m;
        const pressure = current.pressure_msl;
        const weatherCode = current.weather_code;
        const description = this.getWeatherDescription(weatherCode);
        const icon = this.getWeatherIcon(weatherCode);

        // Previsão horária para as próximas 24 horas
        const hourlyHTML = hourly.time.slice(0, 24).map((time, i) => {
          const hour = new Date(time).getHours();
          const tempHour = Math.round(hourly.temperature_2m[i]);
          const codeHour = hourly.weather_code[i];
          const iconHour = this.getWeatherIcon(codeHour);
          return `
            <div class="hourly-item">
              <div class="hour-time">${hour}:00</div>
              <div class="hour-icon">${iconHour}</div>
              <div class="hour-temp">${tempHour}°</div>
            </div>
          `;
        }).join("");

        // Previsão diária para os próximos 7 dias
        const dailyHTML = daily.time.map((date, i) => {
          const day = new Date(date);
          const dayName = new Intl.DateTimeFormat('pt-BR', { weekday: 'short' }).format(day);
          const maxTemp = Math.round(daily.temperature_2m_max[i]);
          const minTemp = Math.round(daily.temperature_2m_min[i]);
          const code = daily.weather_code[i];
          const dayIcon = this.getWeatherIcon(code);
          const dayDesc = this.getWeatherDescription(code);
          return `
            <div class="daily-item">
              <div class="day-name">${dayName}</div>
              <div class="day-icon">${dayIcon}</div>
              <div class="day-temp">
                <span class="day-high">${maxTemp}°</span> <span class="day-low">${minTemp}°</span>
              </div>
              <div class="day-weather">${dayDesc}</div>
            </div>
          `;
        }).join("");

        const html = `
          <div class="current-weather">
            <div class="weather-main">
              <div>
                <div class="location-info">📍 ${name}</div>
                <div class="weather-icon">${icon}</div>
                <div class="temp-display">${temp}��C</div>
                <div class="weather-desc">${description}</div>
                <div style="color: var(--muted); font-size: 0.95rem;">Sensação: ${feelsLike}°C</div>
              </div>
            </div>

            <div class="weather-details">
              <div class="detail-item">
                <div class="detail-label">💧 Umidade</div>
                <div class="detail-value">${humidity}%</div>
              </div>
              <div class="detail-item">
                <div class="detail-label">💨 Vento</div>
                <div class="detail-value">${windSpeed.toFixed(1)} km/h</div>
              </div>
              <div class="detail-item">
                <div class="detail-label">🔽 Pressão</div>
                <div class="detail-value">${pressure} hPa</div>
              </div>
              <div class="detail-item">
                <button onclick="addToFavorites('${name}', ${currentWeather.lat}, ${currentWeather.lon})" style="width: 100%; padding: 10px; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 700;">⭐ Favoritar</button>
              </div>
            </div>
          </div>

          <div class="hourly-forecast">
            <h3>Previsão Horária</h3>
            <div class="hourly-scroll">
              ${hourlyHTML}
            </div>
          </div>

          <div class="daily-forecast">
            <h3>Previsão para 7 Dias</h3>
            <div class="daily-grid">
              ${dailyHTML}
            </div>
          </div>
        `;

        document.getElementById("weatherContainer").innerHTML = html;
        document.getElementById("loadingContainer").style.display = "none";
        document.getElementById("errorContainer").innerHTML = "";
      }

      showLoading() {
        document.getElementById("loadingContainer").style.display = "block";
        document.getElementById("weatherContainer").innerHTML = "";
        document.getElementById("errorContainer").innerHTML = "";
      }

      showError(message) {
        document.getElementById("errorContainer").innerHTML = `<div class="error">❌ ${message}</div>`;
        document.getElementById("loadingContainer").style.display = "none";
        document.getElementById("weatherContainer").innerHTML = "";
      }

      loadFavorites() {
        const html = favorites.map((fav, i) => `
          <button class="favorite-btn" onclick="dashboard.searchByCity('${fav.name}')">
            ${fav.name}
            <span class="remove" onclick="removeFavorite(${i}); event.stopPropagation();">✕</span>
          </button>
        `).join("");
        document.getElementById("favoritesList").innerHTML = html || '<div style="color: var(--muted); font-size: 0.9rem;">Nenhum favorito ainda</div>';
      }
    }

    const dashboard = new WeatherDashboard();

    function addToFavorites(name, lat, lon) {
      if (!favorites.find(f => f.name === name)) {
        favorites.push({ name, lat, lon });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(favorites));
        dashboard.loadFavorites();
        alert(`${name} adicionado aos favoritos!`);
      } else {
        alert(`${name} já está nos favoritos!`);
      }
    }

    function removeFavorite(index) {
      favorites.splice(index, 1);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(favorites));
      dashboard.loadFavorites();
    }
  </script>
</body>
</html>
